schema_version: "1.1"
name: detailed-brief-asks-gaps-only
expected_outcome: |
  Claude summarizes what is already known without re-asking, then digs only into the important gaps: edge cases (conflicts, no-shows, time limits), detailed roles/permissions, success metrics, prototype format/brand. Unapproved assumptions and decisions are labeled. No PRD is created yet. Replies in the user's language (Indonesian).
